
 <!--   changing text animation  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>text changing</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        main{
            height: 100vh;
            width: 100vw;
            background-color: rgb(19, 18, 18);
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgb(150, 158, 158);
            font-size: 2rem;
        }
        span{
            display: inline-block;
            color: white;
            border: 1px solid white;
            box-shadow: 0px 0px 3px rgb(138, 134, 134);
            border-radius: 10px;
            padding: 1px 16px ;
            opacity: 1;
            transform: translateX(0);
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            /* transition: all 0.6s ease-in-out; */
        }
        span.fade-out{
            opacity: 0;
            transform: translateZ(0.8);
        }
        span.fade-in{
            opacity: 1;
            transform: translateZ(1);
        }
        /*  transition isn't working because innerText replaces the content instantly, bypassing CSS transitions, so we changed the format */

    </style>
</head>
<body>
    
    <main>
        A Discovery Engine for &nbsp; 
        <span>creatives</span>
    </main>

    <script>

        const span = document.getElementsByTagName('span');
        //console.log(typeof span,',', span[0].innerHTML);   // object, hi

        const careers = ['creatives','designers','curators','artists'];

        let i = 0;
        let length = careers.length-1;
        const interval = 1200; // Total cycle time (transition + pause)
        setInterval(() => {
            // Fade out current text
            span[0].classList.add('fade-out');
            
            setTimeout(() => {
                // Change text after fade out
                i = (i >= length) ? 0 : i + 1;
                span[0].textContent = careers[i];
                
                // Fade in new text
                span[0].classList.remove('fade-out');
                span[0].classList.add('fade-in');
                
                setTimeout(() => {
                    span[0].classList.remove('fade-in');
                }, 100); // Clean up class after transition
            }, 300); // Half transition time
            
        }, interval);

    </script>
</body>
</html>
