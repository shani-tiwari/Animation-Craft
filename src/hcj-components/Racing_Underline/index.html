<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Racing Underline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        width: 100vw;
        background: #2f2e2e;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: sans-serif;
        gap: 2rem;
        color: rgb(204, 200, 200);
      }
      h1 {
        position: relative;
        cursor: pointer;
        line-height: 1;
      }

      /* 3D Text Shadow Effect */
      .text-3d {
        text-shadow: 0 1px 0 #000, 0 2px 0 #000, 0 3px 0 #000, 0 4px 0 #000,
          0 5px 0 #000, 0 6px 0 transparent, 0 7px 0 transparent;
      }

      /* Underline Animation */
      h1::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -10px;
        width: 100%;
        height: 4px;
        background-color: rgb(204, 200, 200);
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.4s ease-out;
        border-radius: 50px;
        /* box-shadow: 0 5px 5px rgba(0, 0, 0, 0.5); */
      }

      h1:hover::after {
        transform: scaleX(1);
        transform-origin: left;
      }

      /* Sizes */
      .small {
        font-size: 3rem;
      }
      .medium {
        font-size: 5rem;
      }
      .large {
        font-size: 7rem;
      }
    </style>
  </head>
  <body>
    <h1 class="text-3d small">@theshanitiwari</h1>
    <h1 class="text-3d medium">Hover Animation </h1>
    <h1 class="text-3d large">Racing Underline</h1>
  </body>
</html>
