<!doctype html>
<html lang="en">
  <head>
    <!-- wave like effect on an image with SVG -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG + Image</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        width: 100%;
        background: #2a2929;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .imageDiv {
        height: 14rem;
        width: 14rem;
        transform: translate(50%, 50%);
        overflow: hidden;
      }
      img {
        height: 100%;
        width: 100%;
        object-fit: cover;
        filter: url(#noise);
      }
      svg {
        position: absolute;
        /* width: 0;
            height: 0; */
      }
    </style>
  </head>
  <body>
    <div class="imageDiv">
      <img src="../../../public/images/unsplash.jpg" />
    </div>

    <svg>
      <filter id="noise" >
        <!--type- turbulence/fractalNoise, baseF - 1or2 arg -->
        <feTurbulence
          type="turbulence"
          baseFrequency="0.03 0.04"
          result="NOISE"
          numOctaves="1"
          id="turbulence"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="NOISE"
          scale="20"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
      let el = document.getElementById("turbulence");
      tl = new TimelineMax({ paused: true });

      tl.to(el, 4, { attr: { baseFrequency: "0 0" } });
      tl.play();
    </script>
  </body>
</html>
